project_name: "Blame Game"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Done"]
labels: []
date_format: yyyy-mm-dd
max_column_width: 20
auto_open_browser: true
default_port: 6420
remote_operations: true
auto_commit: false
filesystem_only: false
bypass_git_hooks: false
# Off: with it on, every task read re-resolves tasks across all branches, decides the
# set changed, and broadcasts "tasks-updated" — which the board answers with another
# read. That loop pins the web board at ~10 reloads/sec and it never finishes loading.
check_active_branches: false
active_branch_days: 30
task_prefix: "task"
