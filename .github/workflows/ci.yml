name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR cancels the older run: the old result is stale
# anyway, and the free runner minutes are better spent on the current commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  backend-build:
    name: Backend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
      # Railway builds with Nixpacks, which we can't run here. The equivalent
      # check is that a clean install of the *runtime* deps (no dev extras)
      # succeeds and the app imports — that catches a missing dependency or an
      # import error before it reaches the deploy.
      - run: pip install ./backend
      - run: python -c "import app.main"
        working-directory: backend

  flutter-test:
    name: Flutter tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the version used locally. pubspec.yaml only constrains the
      # Dart SDK, so there is no Flutter version to read from a file.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  website-build:
    name: Website build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `build` runs tsc first, so a missing translation key or a broken type
      # fails here rather than shipping a blank section.
      - run: npm run build --workspace @blame-game/website
      # The whole point of the site is that these exist in the HTML, so assert
      # it rather than trusting that the generator still does its job.
      - name: Check the SEO tags survived the build
        run: |
          set -euo pipefail
          for f in apps/website/dist/index.html apps/website/dist/de/index.html; do
            for needle in '<link rel="canonical"' 'hreflang="x-default"' \
                          'property="og:image"' 'application/ld+json'; do
              grep -q "$needle" "$f" || { echo "missing $needle in $f" >&2; exit 1; }
            done
          done
          test -s apps/website/dist/sitemap.xml
          test -s apps/website/dist/robots.txt
          echo "both locales carry canonical, hreflang, og:image and JSON-LD"

# Deployment is not run from here. Railway's own GitHub integration watches
# main and redeploys only when /backend/** changes, which is the filtering we
# want and which it can do natively — see backend/README.md.
#
# It cannot be done from a `railway up` job: that command uploads the contents
# of backend/ as the archive root, so inside the upload the paths are
# app/main.py rather than backend/app/main.py, and a /backend/** watch pattern
# matches nothing and silently skips every deploy.
