[project]
name = "photo-roulette-backend"
version = "0.1.0"
description = "FastAPI backend for the PhotoRoulette game (in-memory, WebSockets)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Pyflakes only: real errors (unused imports/names, shadowing), no style
# opinions -- those are review's job, not the linter's.
select = ["F"]
