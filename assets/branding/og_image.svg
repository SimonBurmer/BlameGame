<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Blame Game social card</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1A2E"/>
      <stop offset=".5" stop-color="#16213E"/>
      <stop offset="1" stop-color="#0F3460"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="347" y="322" width="330" height="380" rx="40"/>
    </clipPath>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <circle cx="1120" cy="70" r="300" fill="#E94560" opacity=".13"/>
  <g transform="translate(-16.24 48.76) scale(0.52)">
    <rect x="347" y="322" width="330" height="380" rx="40" fill="#FFFFFF"/>
    <g clip-path="url(#card)">
      <circle cx="512" cy="459" r="54" fill="#8E97B8"/>
      <ellipse cx="512" cy="725" rx="122" ry="137" fill="#8E97B8"/>
    </g>
    <circle cx="512" cy="512" r="252" fill="none" stroke="#E94560" stroke-width="52"/>
    <rect x="491" y="150" width="42" height="100" rx="21" fill="#E94560" transform="rotate(0 512 512)"/>
    <rect x="491" y="150" width="42" height="100" rx="21" fill="#E94560" transform="rotate(90 512 512)"/>
    <rect x="491" y="150" width="42" height="100" rx="21" fill="#E94560" transform="rotate(180 512 512)"/>
    <rect x="491" y="150" width="42" height="100" rx="21" fill="#E94560" transform="rotate(270 512 512)"/>
  </g>
  <!-- PostScript face names so the weight actually resolves when AppKit
       rasterizes this. The PNG is generated once and committed, so depending on
       a macOS-installed face here is fine; the app icon SVG deliberately has no
       text for exactly the opposite reason. -->
  <text x="502" y="300" font-family="Helvetica, Arial, sans-serif" font-weight="900"
        font-size="82" letter-spacing="4" fill="#FFFFFF">BLAME GAME</text>
  <text x="506" y="364" font-family="Helvetica, Arial, sans-serif"
        font-size="30" fill="#B3BBD1">Guess whose photo it is.</text>
  <rect x="506" y="404" width="140" height="8" rx="4" fill="#E94560"/>
</svg>
